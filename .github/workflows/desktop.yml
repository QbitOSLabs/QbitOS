# QbitOS Desktop Frontend CI
#
# Runs on every push / PR that touches the desktop/ directory.
# Performs: dependency install, TypeScript type-check, Vite production build,
# ESLint (if configured), and Tauri Rust check.

name: Desktop Frontend

on:
  push:
    branches: [main, master]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  typecheck-and-build:
    name: TypeScript check + Vite build
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        working-directory: desktop
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: TypeScript type-check
        working-directory: desktop
        run: npx tsc --noEmit

      - name: Vite production build
        working-directory: desktop
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-dist-${{ github.run_id }}
          path: desktop/dist/
          retention-days: 7

  tauri-rust-check:
    name: Tauri Rust check
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust 1.85.0 (MSRV)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0

      - name: Install system dependencies (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libclang-dev \
            libssl-dev \
            pkg-config \
            cmake

      - name: Cache Cargo build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: desktop-rust

      - name: Cargo check Tauri crate
        run: cargo check -p qbitos-desktop --offline

      - name: Cargo clippy Tauri crate
        run: cargo clippy -p qbitos-desktop -- -D warnings
        continue-on-error: true
