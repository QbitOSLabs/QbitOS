[package]
name = "qbitos-neural-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Native Rust neural inference engine for QbitOS (candle-based)"

[lib]
name = "qbitos_neural_engine"
path = "src/lib.rs"

[[bench]]
name = "inference"
harness = false
path = "benches/inference.rs"

[dependencies]
tokio.workspace = true
parking_lot.workspace = true
async-trait.workspace = true

serde.workspace = true
serde_json.workspace = true

thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true

uuid.workspace = true
chrono.workspace = true
ahash.workspace = true
indexmap.workspace = true
itertools.workspace = true
half.workspace = true
rayon.workspace = true

candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
tokenizers = "0.22"
hf-hub = { version = "0.5", default-features = false, features = ["tokio", "rustls-tls", "ureq"] }
rand = { version = "0.8", features = ["small_rng"] }
ndarray = "0.17"

[features]
default = []

[dev-dependencies]
criterion.workspace = true
