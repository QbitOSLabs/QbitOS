[package]
name = "qbitos-data"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Unified dataset loader for QbitOS: 40+ formats, streaming, S3/MinIO, HuggingFace"

[lib]
name = "qbitos_data"
path = "src/lib.rs"

[[bin]]
name = "qbitos-data"
path = "src/bin/qbitos_data.rs"

[dependencies]
# Core async + sync runtime
tokio = { workspace = true, features = ["fs", "io-util"] }
async-trait = { workspace = true }
parking_lot = { workspace = true }
futures = { workspace = true }

# Serialization (always available — small deps)
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
csv = "1.3"
quick-xml = { version = "0.36", features = ["serialize"] }
toml = { workspace = true }
bytes = { workspace = true }

# Errors + logging
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }

# Utility
uuid = { workspace = true }
chrono = { workspace = true }
ahash = { workspace = true, features = ["serde"] }
indexmap = { workspace = true }
itertools = { workspace = true }
rayon = { workspace = true }
walkdir = "2.5"
glob = "0.3"
regex = "1.11"
sha2 = { workspace = true }
base64 = { workspace = true }
url = { workspace = true }
mime = "0.3"
mime_guess = "2.0"
hex = { workspace = true }
rand = { version = "0.8", features = ["small_rng"] }
clap = { version = "4.5", features = ["derive"] }

# Optional — heavy or system-dependent loaders
calamine = { version = "0.26", optional = true }
pdf-extract = { version = "0.7", optional = true }
scraper = { version = "0.22", optional = true }
rusqlite = { version = "0.32", optional = true, features = ["bundled"] }
arrow = { version = "53", optional = true }
parquet = { version = "53", optional = true }
lmdb-rkv = { version = "0.14", optional = true }
hdf5 = { version = "0.8", optional = true }
gix = { version = "0.66", default-features = false, optional = true }

image = { workspace = true, optional = true }
symphonia = { version = "0.5", optional = true, features = ["mp3", "wav", "ogg", "flac", "aac"] }

flate2 = { version = "1.0", optional = true }
tar = { version = "0.4", optional = true }
zip = { version = "2.2", optional = true }

reqwest = { workspace = true, optional = true }
hf-hub = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3.10"
tokio = { workspace = true, features = ["test-util"] }

[features]
default = [
    "text", "json", "jsonl", "csv", "yaml", "xml",
    "source-code", "conversation", "instruction",
    "function-call", "agent-trajectory", "preference",
    "knowledge-graph", "vector", "time-series", "tabular",
    "archive", "synthetic", "streaming",
    "parquet", "sqlite", "pdf", "html", "image-loader", "excel", "arrow",
]

text = []
json = []
jsonl = []
csv = []
yaml = []
xml = []
source-code = []
conversation = []
instruction = []
function-call = []
agent-trajectory = []
preference = []
knowledge-graph = []
vector = []
time-series = []
tabular = []
synthetic = []
streaming = []

parquet = ["dep:parquet", "dep:arrow"]
arrow = ["dep:arrow"]
sqlite = ["dep:rusqlite"]
excel = ["dep:calamine"]
pdf = ["dep:pdf-extract"]
html = ["dep:scraper"]
git = ["dep:gix"]
image-loader = ["dep:image"]
audio-loader = ["dep:symphonia"]
video-loader = []
ocr-loader = ["dep:image"]
lmdb-loader = ["dep:lmdb-rkv"]
hdf5-loader = ["dep:hdf5"]
archive = ["dep:flate2", "dep:tar", "dep:zip"]
webdataset = ["archive"]
huggingface = ["dep:reqwest", "dep:hf-hub"]
object-storage = ["dep:reqwest"]

all-formats = [
    "parquet", "arrow", "sqlite", "excel", "pdf", "html",
    "git", "image-loader", "audio-loader", "video-loader", "ocr-loader",
    "lmdb-loader", "webdataset", "huggingface", "object-storage",
    # NOTE: `hdf5-loader` is intentionally excluded from `all-formats` because
    # it requires the HDF5 C library to be installed on the system (or
    # `hdf5-src` to be vendored, which adds ~200 MB to the build). Enable
    # explicitly with `--features hdf5-loader` if you need HDF5 support and
    # have HDF5 installed.
]
