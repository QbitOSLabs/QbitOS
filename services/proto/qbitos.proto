syntax = "proto3";

package qbitos.v1;

// QbitOS gRPC API — high-performance internal RPC.
//
// This API mirrors the HTTP REST surface but uses Protocol Buffers for
// wire format and HTTP/2 for transport. Use it for:
//   - Internal microservice-to-microservice communication
//   - High-throughput cognitive-cycle pipelines
//   - Streaming event subscriptions (server-side streaming)
//
// All methods are also available via the HTTP/JSON gateway.

// ─── Cognitive service ──────────────────────────────────────────────────────

service CognitiveService {
  // Liveness probe.
  rpc Health(HealthRequest) returns (HealthResponse);

  // Version info.
  rpc Version(VersionRequest) returns (VersionResponse);

  // Service stats.
  rpc Stats(StatsRequest) returns (StatsResponse);

  // Run a single cognitive cycle (Observe → Improve).
  rpc CognitiveCycle(CognitiveCycleRequest) returns (CognitiveCycleResponse);

  // Subscribe to live cognitive events (server-side streaming).
  rpc StreamEvents(StreamEventsRequest) returns (stream ServiceEvent);

  // ─── Memory ───────────────────────────────────────────────────────────────
  rpc StoreMemory(StoreMemoryRequest) returns (StoreMemoryResponse);
  rpc SearchMemory(SearchMemoryRequest) returns (SearchMemoryResponse);
  rpc DeleteMemory(DeleteMemoryRequest) returns (DeleteMemoryResponse);

  // ─── Skills ───────────────────────────────────────────────────────────────
  rpc ListSkills(ListSkillsRequest) returns (ListSkillsResponse);
  rpc ExecuteSkill(ExecuteSkillRequest) returns (ExecuteSkillResponse);

  // ─── Training ─────────────────────────────────────────────────────────────
  rpc TrainingStep(TrainingStepRequest) returns (TrainingStepResponse);
  rpc GetCurriculum(GetCurriculumRequest) returns (GetCurriculumResponse);
}

// ─── Messages ───────────────────────────────────────────────────────────────

message HealthRequest {}
message HealthResponse {
  string instance_id = 1;
  string instance_name = 2;
  bool healthy = 3;
  string api_version = 4;
  int64 uptime_secs = 5;
  repeated string subsystems = 6;
}

message VersionRequest {}
message VersionResponse {
  string version = 1;
  string commit = 2;
  string build_date = 3;
  string rustc_version = 4;
}

message StatsRequest {}
message StatsResponse {
  int64 uptime_secs = 1;
  uint64 total_requests = 2;
  uint64 active_ws_sessions = 3;
  uint64 events_emitted = 4;
  double cpu_utilization = 5;
  uint64 memory_used_bytes = 6;
  uint64 memory_total_bytes = 7;
  uint32 running_tasks = 8;
  uint64 cycles_completed = 9;
}

message CognitiveCycleRequest {
  string prompt = 1;
  string context_json = 2;  // free-form JSON context
  bool allow_self_improve = 3;
}
message CognitiveCycleResponse {
  string response = 1;
  string result_json = 2;
  uint64 duration_ms = 3;
  repeated string stages_completed = 4;
  bool safety_violation = 5;
}

message StreamEventsRequest {
  uint32 max_events = 1;       // 0 = unlimited
  uint32 timeout_ms = 2;       // 0 = no timeout
  repeated string event_types = 3;  // empty = all
}

message ServiceEvent {
  uint64 seq = 1;
  int64 timestamp_ms = 2;
  string event_type = 3;
  string payload_json = 4;
}

message StoreMemoryRequest {
  string content = 1;
  string metadata_json = 2;
  string memory_type = 3;  // sensory | working | episodic | semantic | procedural | meta
}
message StoreMemoryResponse {
  string id = 1;
  bool success = 2;
}

message SearchMemoryRequest {
  string query = 1;
  uint32 limit = 2;
  string memory_type = 3;  // optional filter
}
message SearchMemoryResponse {
  repeated MemoryResult results = 1;
}
message MemoryResult {
  string id = 1;
  string content = 2;
  double score = 3;
  string metadata_json = 4;
  int64 created_at_ms = 5;
}

message DeleteMemoryRequest {
  string id = 1;
}
message DeleteMemoryResponse {
  bool deleted = 1;
}

message ListSkillsRequest {}
message ListSkillsResponse {
  repeated SkillInfo skills = 1;
}
message SkillInfo {
  uint64 id = 1;
  string name = 2;
  string description = 3;
  double confidence = 4;
  uint64 execution_count = 5;
  uint64 success_count = 6;
}

message ExecuteSkillRequest {
  uint64 skill_id = 1;
  string input_json = 2;
}
message ExecuteSkillResponse {
  bool success = 1;
  string output_json = 2;
  uint64 duration_ms = 3;
  string error = 4;
}

message TrainingStepRequest {
  uint32 steps = 1;
}
message TrainingStepResponse {
  uint32 steps_executed = 1;
  double mean_reward = 2;
  double mean_loss = 3;
  uint64 duration_ms = 4;
}

message GetCurriculumRequest {}
message GetCurriculumResponse {
  string current_stage = 1;
  uint32 current_level = 2;
  double success_rate = 3;
  uint64 samples_at_level = 4;
  repeated string stages = 5;
}
