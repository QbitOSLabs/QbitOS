# QbitOS Production Docker Compose
#
# Usage:
#   docker compose up -d
#
# This compose file starts:
#   - QbitOS cognitive service (HTTP/WS/RPC on port 8080)
#   - PostgreSQL with pgvector (for production memory storage)
#   - Qdrant (for high-performance vector search)
#   - Redis (for hot cache layer)
#   - MongoDB (optional document database)
#
# All services run with restart policies and health checks.
# The QbitOS service runs as a non-root user (UID 1000) inside the container.

services:
  # ─── QbitOS Cognitive Service ──────────────────────────────────────────────
  qbitos:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - qbitos-data:/var/lib/qbitos
      - ./config/production.toml:/etc/qbitos/config.toml:ro
    environment:
      QBITOS_DATA_DIR: /var/lib/qbitos
      QBITOS_CONFIG_PATH: /etc/qbitos/config.toml
      RUST_LOG: ${RUST_LOG:-info}
      QBITOS_LOG_FORMAT: ${QBITOS_LOG_FORMAT:-json}
      QBITOS_TOKEN: ${QBITOS_TOKEN:-}
      DATABASE_URL: postgres://qbitos:${POSTGRES_PASSWORD:-qbitos_password}@postgres:5432/qbitos
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379
      MONGODB_URL: mongodb://mongodb:27017
      QBITOS_ROCKSDB_PATH: /var/lib/qbitos/rocksdb
      QBITOS_DUCKDB_PATH: /var/lib/qbitos/qbitos.duckdb
      QBITOS_SAFETY_ENFORCED: "true"
      QBITOS_AUDIT_LOG: "true"
      QBITOS_ALLOW_SELF_IMPROVE: "false"
    labels:
      com.qbitos.description: "QbitOS cognitive AI operating system (production)"
      com.qbitos.role: "cognitive-core"
    command: >
      serve
        --addr 0.0.0.0:8080
        --name qbitos-prod
        --persistent-events
        --restricted-cors
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Security hardening
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: false
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    mem_limit: 2g
    cpus: 2.0
    networks:
      - qbitos-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─── PostgreSQL with pgvector ──────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    labels:
      com.qbitos.description: "PostgreSQL 16 with pgvector for production memory storage"
      com.qbitos.role: "primary-database"
    environment:
      POSTGRES_USER: qbitos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qbitos_password}
      POSTGRES_DB: qbitos
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Auto-run migrations + seed on first boot (PostgreSQL docker-entrypoint-initdb.d)
      - ./memory/migrations/001_full_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./memory/migrations/002_production_indexes.sql:/docker-entrypoint-initdb.d/02_indexes.sql:ro
      - ./memory/migrations/003_seed_data.sql:/docker-entrypoint-initdb.d/03_seed.sql:ro
    # Don't expose PostgreSQL externally in production — comment out the ports
    # section if you don't need direct access from the host.
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qbitos -d qbitos"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - qbitos-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Qdrant Vector Database ────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    labels:
      com.qbitos.description: "Qdrant vector database for high-performance ANN search"
      com.qbitos.role: "vector-store"
    volumes:
      - qdrant-data:/qdrant/storage
    ports:
      - "6333:6333"
      - "6334:6334"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - qbitos-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Redis Cache ───────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    labels:
      com.qbitos.description: "Redis hot-cache layer"
      com.qbitos.role: "cache"
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    command: >
      redis-server
        --maxmemory 256mb
        --maxmemory-policy allkeys-lru
        --save 60 1
        --loglevel warning
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - qbitos-net
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # ─── MongoDB (optional) ────────────────────────────────────────────────────
  mongodb:
    image: mongo:7
    labels:
      com.qbitos.description: "MongoDB document database (optional backend)"
      com.qbitos.role: "document-store"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-qbitos}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-qbitos_password}
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - qbitos-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─── pgAdmin (debug profile only) ──────────────────────────────────────────
  # Run with: docker compose --profile debug up
  pgadmin:
    image: dpage/pgadmin4:latest
    profiles: ["debug"]
    labels:
      com.qbitos.description: "pgAdmin 4 — PostgreSQL web admin (debug profile only)"
      com.qbitos.role: "admin-ui"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@qbitos.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - qbitos-net

  # ─── Prometheus (monitoring profile only) ──────────────────────────────────
  # Run with: docker compose --profile monitoring up
  prometheus:
    image: prom/prometheus:latest
    profiles: ["monitoring"]
    labels:
      com.qbitos.description: "Prometheus metrics scraper (monitoring profile only)"
      com.qbitos.role: "metrics-scraper"
    volumes:
      - prometheus-data:/prometheus
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9090:9090"
    restart: unless-stopped
    networks:
      - qbitos-net

  # ─── Grafana (monitoring profile only) ─────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    profiles: ["monitoring"]
    labels:
      com.qbitos.description: "Grafana dashboards (monitoring profile only)"
      com.qbitos.role: "dashboards"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - qbitos-net

volumes:
  qbitos-data:
  postgres-data:
  qdrant-data:
  redis-data:
  mongo-data:
  pgadmin-data:
  prometheus-data:
  grafana-data:

networks:
  qbitos-net:
    driver: bridge
