[workspace]
resolver = "3"
members = [
    "kernel",
    "memory",
    "planner",
    "skills",
    "tools",
    "neural_engine",
    "vision",
    "speech",
    "world_model",
    "evolution",
    "data",
    "cli",
    "desktop/src-tauri",
    "reasoning",
    "learning",
    "safety",
    "training",
    "services",
    "examples_pkg",
    "algorithms",
    "multilingual",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["QbitOS Project"]
license = "Apache-2.0"
repository = "https://github.com/qbitos/qbitos"
description = "A Rust 2026 native multimodal cognitive AI operating system"
readme = "README.md"

[workspace.lints.rust]
unsafe_code = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
option_if_let_else = "allow"
redundant_pub_crate = "allow"
struct_excessive_bools = "allow"
use_self = "allow"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.45", features = ["full"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["full"] }
futures = "0.3"
async-trait = "0.1"
parking_lot = "0.12"
crossbeam = "0.8"
crossbeam-channel = "0.5"
flume = "0.12"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
postcard = { version = "1.1", features = ["alloc"] }
rmp-serde = "1.3"
toml = "1.1"

# Errors & logging
thiserror = "2.0"
anyhow = "1.0"
color-eyre = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "chrono"] }
tracing-appender = "0.2"
tracing-error = "0.2"

# ML / neural
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
candle-flash-attn = "0.9"
candle-cuda = "0.9"
tokenizers = "0.22"
hf-hub = { version = "0.5", default-features = false, features = ["tokio", "rustls-tls"] }

# Vision
image = "0.25"
imageproc = "0.25"
rusttype = "0.9"

# Audio / speech
cpal = "0.18"
symphonia = { version = "0.6", features = ["mp3", "wav", "ogg", "flac", "aac"] }
rustfft = "6.2"
rubato = "4.0"
dasp = { version = "0.11", features = ["all"] }

# Database & storage
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }
qdrant-client = "1.12"
redis = { version = "1.2", features = ["tokio-comp", "connection-manager"] }
rocksdb = { version = "0.24", features = ["multi-threaded-cf"] }
mongodb = { version = "3", default-features = false, features = ["rustls-tls", "compat-3-0-0"] }
duckdb = { version = "1", features = ["bundled", "chrono", "serde_json"] }

# Distributed / messaging
tonic = { version = "0.12", features = ["tls", "tls-roots", "gzip"] }
prost = "0.14"
prost-build = "0.14"
quinn = "0.11"
rcgen = "0.13"
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls", "multipart"] }
nats = "0.25"
lapin = "2.5"

# Graph
petgraph = "0.8"
graphblas-rs = "1.0"

# Sandbox / WASM
wasmtime = { version = "34.0", features = ["cranelift", "parallel-compilation", "cache"] }
wasmtime-wasi = "34.0"
wasi-common = "27.0"

# Crypto & security
ring = "0.17"
sha2 = "0.11"
blake3 = "1.5"
argon2 = "0.5"
chacha20poly1305 = "0.10"
ed25519-dalek = { version = "2.1", features = ["pkcs8", "pem", "rand_core"] }
rand = "0.8"
rand_chacha = "0.9"

# Utility
uuid = { version = "1.11", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
url = "2.5"
bytes = "1.8"
byteorder = "1.5"
hex = "0.4"
base64 = "0.23"
once_cell = "1.20"
lazy_static = "1.5"
itertools = "0.14"
either = "1.13"
dashmap = "6.1"
ahash = "0.8"
indexmap = { version = "2.7", features = ["serde"] }
smallvec = { version = "1.13", features = ["serde", "union"] }
smol_str = "0.3"
arc-swap = "1.7"
num_cpus = "1.16"
sysinfo = "0.36"
nvml-wrapper = "0.10"
rayon = "1.10"
ndarray = { version = "0.17", features = ["rayon", "serde"] }
ndarray-rand = "0.15"
half = { version = "2.4", features = ["num-traits", "rand_distr"] }
num-traits = "0.2"

# Config
config = "0.14"
dotenvy = "0.15"

# Dev (referenced via `[dev-dependencies]` with `workspace = true`)
criterion = { version = "0.7", features = ["async_tokio"] }
proptest = "1.5"

# Internal crates
qbitos-kernel = { path = "kernel" }
qbitos-neural-engine = { path = "neural_engine" }
qbitos-vision = { path = "vision" }
qbitos-speech = { path = "speech" }
qbitos-memory = { path = "memory" }
qbitos-world-model = { path = "world_model" }
qbitos-planner = { path = "planner" }
qbitos-skills = { path = "skills" }
qbitos-tools = { path = "tools" }
qbitos-evolution = { path = "evolution" }
qbitos-data = { path = "data" }
qbitos-cli = { path = "cli" }
qbitos-desktop = { path = "desktop/src-tauri" }
qbitos-reasoning = { path = "reasoning" }
qbitos-learning = { path = "learning" }
qbitos-safety = { path = "safety" }
qbitos-training = { path = "training" }
qbitos-services = { path = "services" }
qbitos-examples = { path = "examples_pkg" }
qbitos-algorithms = { path = "algorithms" }
qbitos-multilingual = { path = "multilingual" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
debug = false

[profile.dev]
opt-level = 1
debug = true
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 3

[profile.bench]
opt-level = 3
lto = "thin"
debug = true
