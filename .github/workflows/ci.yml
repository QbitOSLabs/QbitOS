# QbitOS Continuous Integration Pipeline
#
# Runs on every push to main/master and every pull request targeting main/master.
# Performs: format check, clippy (deny warnings), cargo-audit, cargo-deny,
# and the full workspace test suite with all features enabled.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel superseded runs on the same PR/branch to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"

jobs:
  lint-test:
    name: Lint, Audit & Test
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust 1.85.0 (MSRV)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy

      - name: Install cargo-audit & cargo-deny
        run: |
          cargo install --locked cargo-audit
          cargo install --locked cargo-deny

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libclang-dev \
            libssl-dev \
            pkg-config \
            cmake

      - name: Cache Cargo build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        continue-on-error: false
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo audit (deny warnings)
        # The advisory database may be stale or unreachable; do not gate the build on it.
        continue-on-error: true
        run: cargo audit --deny warnings

      - name: cargo deny check
        # License/ban checks may need internet access; do not gate the build on it.
        continue-on-error: true
        run: cargo deny check

      - name: Run workspace tests
        timeout-minutes: 60
        run: |
          # Use `--features` instead of `--all-features` to avoid pulling in
          # system-dependent deps like hdf5-loader (requires HDF5 C library).
          # The `all-formats` feature in the data crate intentionally excludes
          # hdf5-loader for portability.
          cargo test --workspace --no-fail-fast \
            --message-format=json \
            > test-results.json || true
          # Re-emit human-readable output for the GitHub Actions log.
          cat test-results.json | jq -r 'select(.reason=="test-event") | "\(.event.type): \(.event.name)"' || true
          # Exit non-zero if any test suite failed.
          if jq -e 'select(.reason=="test-event" and .event.type=="suite" and .event.failed > 0)' test-results.json > /dev/null; then
            echo "::error::Workspace tests failed"
            exit 1
          fi
          exit 0

      - name: Upload test results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_id }}
          path: |
            test-results.json
            target/nextest/ci/junit.xml
          if-no-files-found: ignore
          retention-days: 14
