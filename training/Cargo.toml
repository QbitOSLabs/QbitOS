[package]
name = "qbitos-training"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Self-learning, self-improvement, curriculum learning, self-play for QbitOS"

[lib]
name = "qbitos_training"
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
parking_lot = { workspace = true }
ahash = { workspace = true, features = ["serde"] }
uuid = { workspace = true }
chrono = { workspace = true }
itertools = { workspace = true }
rayon = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
rand = "0.8"

qbitos-memory = { workspace = true }
qbitos-skills = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }

[features]
default = []
